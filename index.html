<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historial de Equipos - Navarrete</title>

<!-- Importar jsPDF para generar los PDF en el navegador -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:15px;
}

.card{
    background:white;
    max-width:900px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h1{
    color:#0288D1;
    font-size: 22px;
}

h2{
    margin-top:20px;
    font-size: 18px;
}

/* MODIFICADO: Cambiado a 1 sola columna para que encaje perfecto en celulares */
.filtros{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 15px;
}

.filtros input{
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box; /* Asegura que el padding no desborde el ancho */
    font-size: 14px;
}

.btn-pdf {
    background-color: #0288D1;
    color: white;
    border: none;
    padding: 12px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    margin-bottom: 20px;
    font-size: 15px;
}

.btn-pdf:hover {
    background-color: #026ca8;
}

.correctivo{
    margin-top:12px;
    padding:15px;
    border-left:5px solid #0288D1;
    background:#f8f9fa;
    border-radius:6px;
}

.correctivo p{
    margin:5px 0;
    font-size: 14px;
}

.contador{
    margin-bottom:15px;
    color:#555;
    font-weight:bold;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="card">

    <h1>Historial de Mantenimiento</h1>

    <p>
        <strong>Equipo:</strong>
        <span id="nombreEquipo">Cargando...</span>
    </p>

    <p>
        <strong>Marca:</strong>
        <span id="marca"></span>
    </p>

    <p>
        <strong>Modelo:</strong>
        <span id="modelo"></span>
    </p>

    <p>
        <strong>Dato Técnico:</strong>
        <span id="datoTecnico"></span>
    </p>

    <p>
        <strong>Fecha Instalación:</strong>
        <span id="fechaInstalacion"></span>
    </p>

    <h2>Historial de Correctivos</h2>

    <div class="filtros">
        <input
            type="text"
            id="filtroPieza"
            placeholder="Buscar por pieza o componente">

        <input
            type="text"
            id="filtroFecha"
            placeholder="Buscar por fecha (ej: 2020 o 10/2020)">
    </div>

    <button class="btn-pdf" id="btnExportarPDF">Exportar Filtrados a PDF</button>

    <div class="contador" id="contadorResultados">
        Mostrando 0 registros
    </div>

    <div id="correctivos">
        Cargando historial...
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSyC68zo8uHqvSZv6oi7MHHaU-9WvZPddl60",

    authDomain: "equiposnavarrete.firebaseapp.com",

    projectId: "equiposnavarrete",

    storageBucket: "equiposnavarrete.firebasestorage.app"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let listaCorrectivos = [];
let listaFiltradaActual = [];

const params = new URLSearchParams(window.location.search);
const nombreEquipo = params.get("equipo");

if(!nombreEquipo){

    document.getElementById("nombreEquipo").innerText =
        "No se recibió el nombre del equipo";

}
else{

    cargarEquipo();

}

async function cargarEquipo(){

    try{

        const equipoRef =
            doc(db,"equipos",nombreEquipo);

        const equipoSnap =
            await getDoc(equipoRef);

        if(!equipoSnap.exists()){

            document.getElementById("nombreEquipo")
                .innerText =
                "Equipo no encontrado";

            return;

        }

        const equipo = equipoSnap.data();

        document.getElementById("nombreEquipo")
            .innerText =
            equipo.nombreEquipo || "";

        document.getElementById("marca")
            .innerText =
            equipo.marca || "";

        document.getElementById("modelo")
            .innerText =
            equipo.modelo || "";

        document.getElementById("datoTecnico")
            .innerText =
            equipo.datoTecnico || "";

        document.getElementById("fechaInstalacion")
            .innerText =
            equipo.fechaInstalacion || "";

        cargarCorrectivos();

    }
    catch(error){

        console.error(error);

    }

}

async function cargarCorrectivos(){

    try{

        const correctivosRef =
            collection(
                db,
                "equipos",
                nombreEquipo,
                "correctivos"
            );

        const snapshot =
            await getDocs(correctivosRef);

        listaCorrectivos = [];

        snapshot.forEach((docu)=>{

            listaCorrectivos.push(docu.data());

        });

        listaCorrectivos.sort((a, b) => {
            const fA = a.fechaCorrectivo || "";
            const fB = b.fechaCorrectivo || "";
            return fB.localeCompare(fA);
        });

        aplicarFiltros();

    }
    catch(error){

        console.error(error);

    }

}

function mostrarCorrectivos(lista){

    listaFiltradaActual = lista;
    const contenedor =
        document.getElementById("correctivos");

    const contador =
        document.getElementById("contadorResultados");

    contenedor.innerHTML = "";

    contador.innerHTML =
        `Mostrando ${lista.length} registro(s)`;

    if(lista.length === 0){

        contenedor.innerHTML =
            "<p>No se encontraron registros.</p>";

        return;
    }

    lista.forEach((c)=>{

        const div =
            document.createElement("div");

        div.className =
            "correctivo";

        div.innerHTML = `

            <p>
                <strong>Pieza / Componente:</strong>
                ${c.piezaComponente || "-"}
            </p>

            <p>
                <strong>Actividad:</strong>
                ${c.actividad || "-"}
            </p>

            <p>
                <strong>Proveedor:</strong>
                ${c.proveedor || "-"}
            </p>

            <p>
                <strong>Marca:</strong>
                ${c.marca || "-"}
            </p>

            <p>
                <strong>Modelo:</strong>
                ${c.modelo || "-"}
            </p>

            <p>
                <strong>Fecha Correctivo:</strong>
                ${c.fechaCorrectivo || "-"}
            </p>

        `;

        contenedor.appendChild(div);

    });

}

function aplicarFiltros(){

    const pieza =
        document.getElementById("filtroPieza")
        .value
        .toLowerCase()
        .trim();

    const fecha =
        document.getElementById("filtroFecha")
        .value
        .toLowerCase()
        .trim();

    const filtrados =
        listaCorrectivos.filter(c => {
            const piezaComp = (c.piezaComponente || "").toLowerCase();
            const fechaCorr = (c.fechaCorrectivo || "").toLowerCase();

            const coincidePieza = piezaComp.includes(pieza);
            const coincideFecha = fechaCorr.includes(fecha);

            return coincidePieza && coincideFecha;
        });

    mostrarCorrectivos(filtrados);

}

function exportarPDFFiltrado() {
    const { jsPDF } = window.jspdf;
    const docPdf = new jsPDF();

    const nombreEq = document.getElementById("nombreEquipo").innerText;
    const marcaEq = document.getElementById("marca").innerText;
    const modeloEq = document.getElementById("modelo").innerText;

    docPdf.setFontSize(16);
    docPdf.setTextColor(2, 136, 209);
    docPdf.text("Historial de Mantenimiento Filtrado", 14, 20);

    docPdf.setFontSize(11);
    docPdf.setTextColor(0, 0, 0);
    docPdf.text(`Equipo: ${nombreEq}`, 14, 30);
    docPdf.text(`Marca: ${marcaEq} | Modelo: ${modeloEq}`, 14, 37);

    let y = 48;

    if (listaFiltradaActual.length === 0) {
        docPdf.text("No hay registros para exportar con los filtros actuales.", 14, y);
    } else {
        listaFiltradaActual.forEach((c) => {
            if (y > 270) {
                docPdf.addPage();
                y = 20;
            }

            docPdf.setFillColor(240, 244, 248);
            docPdf.rect(14, y, 182, 36, "F");

            docPdf.setFont("helvetica", "bold");
            docPdf.text(`PIEZA: ${c.piezaComponente || "-"}`, 18, y + 7);
            
            docPdf.setFont("helvetica", "normal");
            docPdf.text(`Actividad: ${c.actividad || "-"}`, 18, y + 14);
            docPdf.text(`Proveedor: ${c.proveedor || "-"}`, 18, y + 21);
            docPdf.text(`Marca: ${c.marca || "-"} | Modelo: ${c.modelo || "-"}`, 18, y + 28);
            docPdf.text(`Fecha: ${c.fechaCorrectivo || "-"}`, 140, y + 28);

            y += 42;
        });
    }

    docPdf.save(`Historial_${nombreEq.replace(/\s+/g, "_")}_Filtrado.pdf`);
}

document
.getElementById("filtroPieza")
.addEventListener("input", aplicarFiltros);

document
.getElementById("filtroFecha")
.addEventListener("input", aplicarFiltros);

document
.getElementById("btnExportarPDF")
.addEventListener("click", exportarPDFFiltrado);

</script>

</body>
</html>
