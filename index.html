<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historial de Equipos - Navarrete</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.card{
    background:white;
    max-width:900px;
    margin:auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h1{
    color:#0288D1;
}

h2{
    margin-top:25px;
}

.filtros{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.filtros input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.correctivo{
    margin-top:12px;
    padding:15px;
    border-left:5px solid #0288D1;
    background:#f8f9fa;
    border-radius:6px;
}

.correctivo p{
    margin:5px 0;
}

.contador{
    margin-bottom:15px;
    color:#555;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

    <h1>Historial de Mantenimiento</h1>

    <p>
        <strong>Equipo:</strong>
        <span id="nombreEquipo">Cargando...</span>
    </p>

    <p>
        <strong>Marca:</strong>
        <span id="marca"></span>
    </p>

    <p>
        <strong>Modelo:</strong>
        <span id="modelo"></span>
    </p>

    <p>
        <strong>Dato Técnico:</strong>
        <span id="datoTecnico"></span>
    </p>

    <p>
        <strong>Fecha Instalación:</strong>
        <span id="fechaInstalacion"></span>
    </p>

    <h2>Historial de Correctivos</h2>

    <div class="filtros">

        <input
            type="text"
            id="filtroPieza"
            placeholder="Buscar por pieza o componente">

        <input
            type="text"
            id="filtroFecha"
            placeholder="Buscar por fecha (ej: 12/10/2020)">

    </div>

    <div class="contador" id="contadorResultados">
        Mostrando 0 registros
    </div>

    <div id="correctivos">
        Cargando historial...
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSyC68zo8uHqvSZv6oi7MHHaU-9WvZPddl60",

    authDomain: "equiposnavarrete.firebaseapp.com",

    projectId: "equiposnavarrete",

    storageBucket: "equiposnavarrete.firebasestorage.app"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let listaCorrectivos = [];

const params = new URLSearchParams(window.location.search);
const nombreEquipo = params.get("equipo");

if(!nombreEquipo){

    document.getElementById("nombreEquipo").innerText =
        "No se recibió el nombre del equipo";

}
else{

    cargarEquipo();

}

async function cargarEquipo(){

    try{

        const equipoRef =
            doc(db,"equipos",nombreEquipo);

        const equipoSnap =
            await getDoc(equipoRef);

        if(!equipoSnap.exists()){

            document.getElementById("nombreEquipo")
                .innerText =
                "Equipo no encontrado";

            return;

        }

        const equipo = equipoSnap.data();

        document.getElementById("nombreEquipo")
            .innerText =
            equipo.nombreEquipo || "";

        document.getElementById("marca")
            .innerText =
            equipo.marca || "";

        document.getElementById("modelo")
            .innerText =
            equipo.modelo || "";

        document.getElementById("datoTecnico")
            .innerText =
            equipo.datoTecnico || "";

        document.getElementById("fechaInstalacion")
            .innerText =
            equipo.fechaInstalacion || "";

        cargarCorrectivos();

    }
    catch(error){

        console.error(error);

    }

}

async function cargarCorrectivos(){

    try{

        const correctivosRef =
            collection(
                db,
                "equipos",
                nombreEquipo,
                "correctivos"
            );

        const snapshot =
            await getDocs(correctivosRef);

        listaCorrectivos = [];

        snapshot.forEach((docu)=>{

            listaCorrectivos.push(docu.data());

        });

        mostrarCorrectivos(listaCorrectivos);

    }
    catch(error){

        console.error(error);

    }

}

function mostrarCorrectivos(lista){

    const contenedor =
        document.getElementById("correctivos");

    const contador =
        document.getElementById("contadorResultados");

    contenedor.innerHTML = "";

    contador.innerHTML =
        `Mostrando ${lista.length} registro(s)`;

    if(lista.length === 0){

        contenedor.innerHTML =
            "<p>No se encontraron registros.</p>";

        return;
    }

    lista.forEach((c)=>{

        const div =
            document.createElement("div");

        div.className =
            "correctivo";

        div.innerHTML = `

            <p>
                <strong>Pieza / Componente:</strong>
                ${c.piezaComponente || "-"}
            </p>

            <p>
                <strong>Actividad:</strong>
                ${c.actividad || "-"}
            </p>

            <p>
                <strong>Proveedor:</strong>
                ${c.proveedor || "-"}
            </p>

            <p>
                <strong>Marca:</strong>
                ${c.marca || "-"}
            </p>

            <p>
                <strong>Modelo:</strong>
                ${c.modelo || "-"}
            </p>

            <p>
                <strong>Fecha Correctivo:</strong>
                ${c.fechaCorrectivo || "-"}
            </p>

        `;

        contenedor.appendChild(div);

    });

}

function aplicarFiltros(){

    const pieza =
        document.getElementById("filtroPieza")
        .value
        .toLowerCase();

    const fecha =
        document.getElementById("filtroFecha")
        .value
        .toLowerCase();

    const filtrados =
        listaCorrectivos.filter(c =>

            (c.piezaComponente || "")
                .toLowerCase()
                .includes(pieza)

            &&

            (c.fechaCorrectivo || "")
                .toLowerCase()
                .includes(fecha)

        );

    mostrarCorrectivos(filtrados);

}

document
.getElementById("filtroPieza")
.addEventListener("input", aplicarFiltros);

document
.getElementById("filtroFecha")
.addEventListener("input", aplicarFiltros);

</script>

</body>
</html>
